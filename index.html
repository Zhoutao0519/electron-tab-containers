<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>多标签页桌面端示例</title>
  </head>
  <body>
    <div class="container">
      <tab-group class="tab-group" new-tab-button="true"></tab-group>
      <div class="window-controls">
        <button class="window-control-btn" data-window-action="minimize" type="button" aria-label="最小化">
          <span class="window-icon minimize"></span>
        </button>
        <button class="window-control-btn" data-window-action="fullscreen" type="button" aria-label="全屏">
          <span class="window-icon fullscreen"></span>
        </button>
        <button class="window-control-btn close" data-window-action="close" type="button" aria-label="关闭">
          <span class="window-icon close"></span>
        </button>
      </div>
    </div>
    <script type="module" src="./render/main.ts"></script>
  </body>
</html>

<style>
  body {
    margin: 0;
    background: #eff0f4;
  }

  .container {
    height: 40px;
    display: flex;
    -webkit-app-region: drag;
    background-color: #121e41;
  }

  .container .tab-group {
    display: flex;
    flex: 1;
    overflow-x: auto;
    overflow-y: hidden;
    padding-bottom: 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(120, 128, 140, 0.55) transparent;
  }

  .container .tab-group::-webkit-scrollbar {
    height: 6px;
  }

  .container .tab-group::-webkit-scrollbar-track {
    background: transparent;
  }

  .container .tab-group::-webkit-scrollbar-thumb {
    border-radius: 999px;
    background: rgba(120, 128, 140, 0.55);
  }

  .container .tab-group::-webkit-scrollbar-thumb:hover {
    background: rgba(98, 107, 120, 0.7);
  }

  .window-controls {
    display: flex;
    align-items: center;
    margin-left: 6px;
    -webkit-app-region: no-drag;
  }

  .window-control-btn {
    width: 44px;
    height: 32px;
    padding: 0;
    border: none;
    border-radius: 0;
    background: transparent;
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .window-control-btn:hover {
    background: rgba(0, 0, 0, 0.08);
  }

  .window-control-btn.close {
    color: #fff;
  }

  .window-control-btn.close:hover {
    background: #e81123;
    color: #fff;
  }

  .window-icon {
    position: relative;
    width: 12px;
    height: 12px;
    display: inline-block;
  }

  .window-icon.minimize::before {
    content: '';
    position: absolute;
    left: 0;
    right: 0;
    bottom: 2px;
    height: 1.5px;
    background: currentColor;
  }

  .window-icon.fullscreen::before {
    content: '';
    position: absolute;
    top: 1px;
    left: 1px;
    width: 8px;
    height: 8px;
    border: 1.5px solid currentColor;
  }

  .window-icon.close::before,
  .window-icon.close::after {
    content: '';
    position: absolute;
    top: 0;
    left: 5px;
    width: 1.5px;
    height: 12px;
    background: currentColor;
  }

  .window-icon.close::before {
    transform: rotate(45deg);
  }

  .window-icon.close::after {
    transform: rotate(-45deg);
  }

  .tab-group-button.hidden {
    display: none;
  }

  .tab-group-button .button-left {
    display: flex;
    width: 20px;
    height: 100%;
    margin-left: 7px;
    background-image: url('./assets/tab_group_left.png');
    background-size: 20px 32px;
    background-repeat: no-repeat;
    background-position: bottom;
  }

  .tab-group-button .button-right {
    width: 20px;
    height: 100%;
    margin-right: 7px;
    background-image: url('./assets/tab_group_right.png');
    background-size: 20px 32px;
    background-repeat: no-repeat;
    background-position: bottom;
  }
</style>
